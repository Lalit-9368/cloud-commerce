apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
  namespace: {{ .Values.global.namespace }}
  labels:
    app: catalog-service
    {{- include "cloud-commerce.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.catalogService.replicaCount }}

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: catalog-service

  template:
    metadata:
      labels:
        app: catalog-service

    spec:
      containers:
        - name: catalog-service

          image: "{{ .Values.global.image.registry }}/{{ .Values.catalogService.image.repository }}:{{ .Values.catalogService.image.tag }}"

          imagePullPolicy: {{ .Values.global.imagePullPolicy }}

          ports:
            - name: http
              containerPort: 4002
              protocol: TCP

          readinessProbe:
            tcpSocket:
              port: 4002
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            tcpSocket:
              port: 4002
            initialDelaySeconds: 15
            periodSeconds: 20

          resources:
            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: 500m
              memory: 512Mi