name: CD

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloud-commerce-production
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  EKS_CLUSTER_NAME: cloud-commerce-prod
  HELM_RELEASE_NAME: cloud-commerce
  HELM_CHART_PATH: ./helm/cloud-commerce
  K8S_NAMESPACE: cloud-commerce

jobs:
  release:
    name: Build, scan, push and sign images
    runs-on: ubuntu-latest
    environment: production

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: frontend
            context: ./frontend
          - service: auth-service
            context: ./auth-service
          - service: catalog-service
            context: ./catalog-service
          - service: checkout-service
            context: ./checkout-service
          - service: payment-service
            context: ./payment-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}

      - name: Verify AWS identity
        run: |
          set -euo pipefail
          aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set immutable image tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${GITHUB_SHA}"
          fi

          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "Image tag: ${TAG}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for EKS AMD64 nodes
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: false
          load: true
          tags: cloud-commerce/${{ matrix.service }}:${{ steps.meta.outputs.tag }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cloud-commerce/${{ matrix.service }}:${{ steps.meta.outputs.tag }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Push image to ECR
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail

          IMAGE_NAME="${REGISTRY}/cloud-commerce-${{ matrix.service }}:${TAG}"

          docker tag \
            "cloud-commerce/${{ matrix.service }}:${TAG}" \
            "${IMAGE_NAME}"

          docker push "${IMAGE_NAME}"

          echo "Pushed: ${IMAGE_NAME}"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.9.0

      - name: Sign image with Cosign
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail

          IMAGE="${REGISTRY}/cloud-commerce-${{ matrix.service }}:${TAG}"

          cosign sign --yes "${IMAGE}"

          echo "Signed: ${IMAGE}"

  deploy:
    name: Deploy to EKS with Helm
    runs-on: ubuntu-latest
    needs: release
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}

      - name: Verify AWS identity
        run: |
          set -euo pipefail
          aws sts get-caller-identity

      - name: Verify EKS cluster
        run: |
          set -euo pipefail

          STATUS="$(
            aws eks describe-cluster \
              --region "${AWS_REGION}" \
              --name "${EKS_CLUSTER_NAME}" \
              --query 'cluster.status' \
              --output text
          )"

          echo "EKS cluster status: ${STATUS}"

          if [[ "${STATUS}" != "ACTIVE" ]]; then
            echo "ERROR: EKS cluster is not ACTIVE."
            exit 1
          fi

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Configure kubectl for EKS
        run: |
          set -euo pipefail

          aws eks update-kubeconfig \
            --region "${AWS_REGION}" \
            --name "${EKS_CLUSTER_NAME}"

      - name: Verify Kubernetes access
        run: |
          set -euo pipefail

          kubectl cluster-info
          kubectl get nodes

      - name: Ensure deployment namespace exists
        run: |
          set -euo pipefail

          kubectl create namespace "${K8S_NAMESPACE}" \
            --dry-run=client \
            -o yaml |
            kubectl apply -f -

          kubectl get namespace "${K8S_NAMESPACE}"

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set deployment values
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${GITHUB_SHA}"
          fi

          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

          echo "Deployment tag: ${TAG}"
          echo "ECR registry: ${{ steps.ecr.outputs.registry }}"

      - name: Helm lint
        run: |
          set -euo pipefail

          helm lint "${HELM_CHART_PATH}"

      - name: Helm render validation
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail

          helm template \
            "${HELM_RELEASE_NAME}" \
            "${HELM_CHART_PATH}" \
            --namespace "${K8S_NAMESPACE}" \
            --set-string global.image.registry="${ECR_REGISTRY}" \
            --set-string frontend.image.tag="${IMAGE_TAG}" \
            --set-string authService.image.tag="${IMAGE_TAG}" \
            --set-string catalogService.image.tag="${IMAGE_TAG}" \
            --set-string checkoutService.image.tag="${IMAGE_TAG}" \
            --set-string paymentService.image.tag="${IMAGE_TAG}" \
            > /tmp/cloud-commerce-rendered.yaml

          kubectl apply \
            --dry-run=server \
            -f /tmp/cloud-commerce-rendered.yaml

      - name: Deploy with Helm
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail

          helm upgrade --install "${HELM_RELEASE_NAME}" "${HELM_CHART_PATH}" \
            --namespace "${K8S_NAMESPACE}" \
            --create-namespace \
            --set-string global.image.registry="${ECR_REGISTRY}" \
            --set-string frontend.image.tag="${IMAGE_TAG}" \
            --set-string authService.image.tag="${IMAGE_TAG}" \
            --set-string catalogService.image.tag="${IMAGE_TAG}" \
            --set-string checkoutService.image.tag="${IMAGE_TAG}" \
            --set-string paymentService.image.tag="${IMAGE_TAG}" \
            --wait \
            --timeout 10m

      - name: Verify deployment
        run: |
          set -euo pipefail

          echo "=== Helm Release ==="
          helm status "${HELM_RELEASE_NAME}" \
            --namespace "${K8S_NAMESPACE}"

          echo "=== Helm Revision ==="
          helm history "${HELM_RELEASE_NAME}" \
            --namespace "${K8S_NAMESPACE}" \
            --max 1

          echo "=== Deployments ==="
          kubectl get deployments \
            --namespace "${K8S_NAMESPACE}"

          kubectl rollout status deployment/auth-service \
            --namespace "${K8S_NAMESPACE}" \
            --timeout=5m

          kubectl rollout status deployment/catalog-service \
            --namespace "${K8S_NAMESPACE}" \
            --timeout=5m

          kubectl rollout status deployment/checkout-service \
            --namespace "${K8S_NAMESPACE}" \
            --timeout=5m

          kubectl rollout status deployment/frontend \
            --namespace "${K8S_NAMESPACE}" \
            --timeout=5m

          kubectl rollout status deployment/payment-service \
            --namespace "${K8S_NAMESPACE}" \
            --timeout=5m

          echo "=== HPAs ==="
          kubectl get hpa \
            --namespace "${K8S_NAMESPACE}"

          HPA_COUNT="$(
            kubectl get hpa \
              --namespace "${K8S_NAMESPACE}" \
              --no-headers |
            wc -l |
            tr -d ' '
          )"

          if [[ "${HPA_COUNT}" -ne 5 ]]; then
            echo "ERROR: Expected 5 HPAs, found ${HPA_COUNT}"
            exit 1
          fi

          echo "=== Helm HPA Manifest Check ==="
          HPA_MANIFEST_COUNT="$(
            helm get manifest \
              "${HELM_RELEASE_NAME}" \
              --namespace "${K8S_NAMESPACE}" |
            grep -c '^kind: HorizontalPodAutoscaler$' || true
          )"

          if [[ "${HPA_MANIFEST_COUNT}" -ne 5 ]]; then
            echo "ERROR: Expected 5 HPA manifests in Helm release, found ${HPA_MANIFEST_COUNT}"
            exit 1
          fi

          echo "Production deployment verification passed."

      - name: Show deployment
        run: |
          set -euo pipefail

          echo "=== Deployments ==="
          kubectl get deployments \
            --namespace "${K8S_NAMESPACE}"

          echo "=== Services ==="
          kubectl get services \
            --namespace "${K8S_NAMESPACE}"
