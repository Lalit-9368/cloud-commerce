name: CD

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  release:
    name: Build, scan, push and sign images
    runs-on: ubuntu-latest
    environment: production

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: frontend
            context: ./frontend
          - service: auth-service
            context: ./auth-service
          - service: catalog-service
            context: ./catalog-service
          - service: checkout-service
            context: ./checkout-service
          - service: payment-service
            context: ./payment-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set immutable image tag
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          load: true
          tags: cloud-commerce/${{ matrix.service }}:${{ steps.meta.outputs.tag }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cloud-commerce/${{ matrix.service }}:${{ steps.meta.outputs.tag }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Push image to ECR
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker tag \
            "cloud-commerce/${{ matrix.service }}:${TAG}" \
            "${REGISTRY}/cloud-commerce-${{ matrix.service }}:${TAG}"

          docker push \
            "${REGISTRY}/cloud-commerce-${{ matrix.service }}:${TAG}"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.9.0

      - name: Sign image with Cosign
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          cosign sign --yes \
            "${REGISTRY}/cloud-commerce-${{ matrix.service }}:${TAG}"

  deploy:
    name: Deploy all services to EC2
    runs-on: ubuntu-latest
    needs: release
    environment: production

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Set deployment values
        id: meta
        shell: bash
        env:
          ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
        run: |
          set -euo pipefail

          if [[ -n "${ECR_REGISTRY}" ]]; then
            echo "registry=${ECR_REGISTRY}" >> "$GITHUB_OUTPUT"
          else
            ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
            echo "registry=${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com" >> "$GITHUB_OUTPUT"
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy on EC2 through SSM
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
          ECR_REGISTRY: ${{ steps.meta.outputs.registry }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail

          if [[ -z "${EC2_INSTANCE_ID}" ]]; then
            echo "ERROR: GitHub production variable EC2_INSTANCE_ID is not set."
            exit 1
          fi

          if [[ -z "${AWS_REGION}" ]]; then
            echo "ERROR: GitHub production variable AWS_REGION is not set."
            exit 1
          fi

          if [[ -z "${ECR_REGISTRY}" ]]; then
            echo "ERROR: ECR registry could not be determined."
            exit 1
          fi

          COMMANDS_JSON="$(python3 - <<'PY'
          import json
          import os

          commands = [
              "set -euo pipefail",
              "cd /opt/cloud-commerce",
              f"export IMAGE_TAG={os.environ['IMAGE_TAG']!r}",
              f"export AWS_REGION={os.environ['AWS_REGION']!r}",
              f"export ECR_REGISTRY={os.environ['ECR_REGISTRY']!r}",
              'aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"',
              'docker compose pull',
              'docker compose up -d --remove-orphans',
              'docker image prune -f'
          ]

          print(json.dumps({"commands": commands}))
          PY
          )"

          COMMAND_ID="$(
            aws ssm send-command \
              --instance-ids "$EC2_INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --parameters "$COMMANDS_JSON" \
              --query "Command.CommandId" \
              --output text
          )"

          echo "SSM command: ${COMMAND_ID}"

          for _ in {1..30}; do
            STATUS="$(
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$EC2_INSTANCE_ID" \
                --query "Status" \
                --output text
            )"

            echo "Deployment status: ${STATUS}"

            case "$STATUS" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query "StandardOutputContent" \
                  --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query "StandardErrorContent" \
                  --output text
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "Deployment timed out."
          exit 1