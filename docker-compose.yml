services:
  frontend:
    build: ./frontend
    ports:
      - "9000:80"
    depends_on:
      - auth-service
      - catalog-service
      - checkout-service
      - payment-service

  auth-service:
    build: ./auth-service
    ports:
      - "4001:4001"
    environment:
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      PORT: 4001
      USERS_FILE: /data/users.json
    volumes:
      - auth-data:/data

  catalog-service:
    build: ./catalog-service
    ports:
      - "4002:4002"

  checkout-service:
    build: ./checkout-service
    ports:
      - "4003:4003"
    environment:
      PORT: 4003
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      CATALOG_URL: http://catalog-service:4002
      PAYMENT_URL: http://payment-service:4004
    depends_on:
      - catalog-service
      - payment-service
      - auth-service

  payment-service:
    build: ./payment-service
    ports:
      - "4004:4004"
    environment:
      PORT: 4004
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}

volumes:
  auth-data:
