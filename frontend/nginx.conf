server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location = /api/auth/health {
    proxy_pass http://auth-service:4001/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location /api/auth/ {
    proxy_pass http://auth-service:4001/auth/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/catalog/ {
    proxy_pass http://catalog-service:4002/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/checkout/ {
    proxy_pass http://checkout-service:4003/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /api/payment/health {
    proxy_pass http://payment-service:4004/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location = /api/payment/webhook {
    proxy_pass http://payment-service:4004/payments/webhook;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/payment/ {
    proxy_pass http://payment-service:4004/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /api/checkout/health {
    proxy_pass http://checkout-service:4003/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location = /api/catalog/health {
    proxy_pass http://catalog-service:4002/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
